[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vinyl-deals"
version = "0.1.0"
description = "Conservative monitoring of vinyl-record offers in Russia"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vinyl-deals = "vinyl_deals.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_deals"]

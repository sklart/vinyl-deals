[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vinyl-deals"
version = "0.1.0"
description = "Conservative monitoring of vinyl-record offers in Russia"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.scripts]
vinyl-deals = "vinyl_deals.cli:main"
vinyl-deals-gui = "vinyl_deals.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_deals"]

[tool.hatch.build.targets.wheel.force-include]
"src/vinyl_deals/assets/vinyl-deals.ico" = "vinyl_deals/assets/vinyl-deals.ico"
